name: Publish SocialFlow OS

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

jobs:
  publish-macos:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build and publish signed update
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: "-"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: app-v__VERSION__
          releaseName: "SocialFlow OS v__VERSION__"
          releaseBody: "Signed SocialFlow OS desktop update. Existing installations receive this release automatically."
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: --target ${{ matrix.target }}
