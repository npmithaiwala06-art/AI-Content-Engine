<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181923"/>
      <stop offset="1" stop-color="#101118"/>
    </linearGradient>
    <radialGradient id="lavGlow" cx="0" cy="0" r="1" gradientTransform="translate(832 236) rotate(125) scale(450)">
      <stop offset="0" stop-color="#bba2ff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#bba2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="0" cy="0" r="1" gradientTransform="translate(160 1110) rotate(-35) scale(430)">
      <stop offset="0" stop-color="#b7e5d8" stop-opacity=".15"/>
      <stop offset="1" stop-color="#b7e5d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#lavGlow)"/>
  <rect width="1080" height="1350" fill="url(#mintGlow)"/>

  <!-- quiet technical grid -->
  <g opacity=".055" stroke="#ffffff" stroke-width="1">
    <path d="M80 0V1350M280 0V1350M480 0V1350M680 0V1350M880 0V1350M1080 0V1350"/>
    <path d="M0 150H1080M0 350H1080M0 550H1080M0 750H1080M0 950H1080M0 1150H1080"/>
  </g>

  <!-- brand lockup -->
  <g transform="translate(88 82)">
    <g transform="translate(0 0)">
      <circle cx="14" cy="14" r="14" fill="#bca5ff"/>
      <circle cx="51" cy="14" r="14" fill="#292d38"/>
      <circle cx="88" cy="14" r="14" fill="#292d38"/>
      <circle cx="14" cy="51" r="14" fill="#292d38"/>
      <circle cx="51" cy="51" r="14" fill="#b9e6d9"/>
      <circle cx="88" cy="51" r="14" fill="#292d38"/>
      <circle cx="14" cy="88" r="14" fill="#292d38"/>
      <circle cx="51" cy="88" r="14" fill="#292d38"/>
      <circle cx="88" cy="88" r="14" fill="#ffc7a9"/>
    </g>
    <text x="132" y="44" fill="#f8f7fb" font-family="Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="12">ZEROONE</text>
    <text x="134" y="82" fill="#a8a8b3" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="7">D  ·  O  ·  T  ·  S  AI</text>
  </g>

  <rect x="86" y="268" width="194" height="44" rx="22" fill="#bca5ff" fill-opacity=".13" stroke="#bca5ff" stroke-opacity=".42"/>
  <text x="183" y="296" text-anchor="middle" fill="#d8cbff" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">AI, MADE YOURS</text>

  <!-- primary message -->
  <text x="84" y="435" fill="#f8f7fb" font-family="Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-3">Stop renting</text>
  <text x="84" y="539" fill="#f8f7fb" font-family="Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-3">intelligence.</text>
  <text x="84" y="690" fill="#f2edf5" font-family="Georgia, Times New Roman, serif" font-size="46" font-style="italic">Build AI that belongs</text>
  <text x="84" y="748" fill="#f2edf5" font-family="Georgia, Times New Roman, serif" font-size="46" font-style="italic">to your business.</text>

  <!-- ownership rail -->
  <g transform="translate(86 846)" filter="url(#shadow)">
    <rect width="908" height="224" rx="28" fill="#1f212c" stroke="#ffffff" stroke-opacity=".09"/>
    <circle cx="64" cy="70" r="8" fill="#bca5ff"/>
    <text x="92" y="79" fill="#f7f5fa" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600">Your workflows</text>
    <circle cx="347" cy="70" r="8" fill="#b9e6d9"/>
    <text x="375" y="79" fill="#f7f5fa" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600">Your knowledge</text>
    <circle cx="675" cy="70" r="8" fill="#ffc7a9"/>
    <text x="703" y="79" fill="#f7f5fa" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600">Your edge</text>
    <path d="M64 119H844" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="64" y="168" fill="#aaaab6" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" letter-spacing=".3">Custom AI systems designed around how your team actually works.</text>
  </g>

  <!-- footer CTA -->
  <text x="86" y="1194" fill="#ffffff" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="1">YOUR AI IMPLEMENTATION PARTNER</text>
  <text x="86" y="1244" fill="#92939f" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" letter-spacing="1">Own Your AI — Don’t Rent It.</text>
  <rect x="790" y="1161" width="204" height="68" rx="34" fill="#b9e6d9"/>
  <text x="892" y="1204" text-anchor="middle" fill="#14151d" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1">LET’S BUILD →</text>

  <text x="994" y="1304" text-anchor="end" fill="#5f606b" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="4">DEMO 01</text>
</svg>
